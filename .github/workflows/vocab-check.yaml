name: vocab-check
on: [push, pull_request]
jobs:
  grep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forbid banned vocabulary
        run: |
          if grep -rE 'leverage|robust|comprehensive|seamless|streamline|delve|utilize|harness' R/ man/ vignettes/ README.md ; then
            echo "::error::Banned vocabulary patterns detected. Re-word the flagged passages."
            exit 1
          fi
